<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--ink:#14202e;--mute:#3d4b5c;--line:#d5dbe3;--acc:#1f5f8b;--acc2:#f1f6fa}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:clamp(18px,1.2vw + 14px,22px);line-height:1.9;padding:20px 14px 70px;direction:rtl;text-align:right}
main{max-width:880px;margin:auto}
h1{font-size:1.6em;margin:0 0 6px;line-height:1.5}
.sub{color:var(--mute);margin:0 0 18px;font-size:.9em}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:#fff;padding:10px 0;z-index:2;border-bottom:1px solid var(--line)}
nav button,.tools button{font:inherit;font-size:.8em;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer;min-height:44px}
nav button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:44px}
h2{font-size:1.2em;margin:30px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--acc);line-height:1.5}
details{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
summary{cursor:pointer;padding:14px 16px;list-style:none}
summary::-webkit-details-marker{display:none}
.n{color:var(--acc);font-weight:700;margin-inline-end:8px;unicode-bidi:isolate}
.en{direction:ltr;text-align:left;unicode-bidi:isolate;font-weight:600;display:block;font-size:1.05em;line-height:1.6}
.ar{direction:rtl;text-align:right;unicode-bidi:isolate;display:block;color:var(--mute);margin-top:6px}
.ans{padding:12px 16px 16px;border-top:1px dashed var(--line);background:var(--acc2);border-radius:0 0 10px 10px}
.ans .a-en{direction:ltr;text-align:left;unicode-bidi:isolate;margin:0 0 10px;line-height:1.6}
.ans .a-ar{direction:rtl;text-align:right;unicode-bidi:isolate;margin:0}
@media (max-width:520px){body{padding:14px 10px 60px}summary{padding:12px}.ans{padding:10px 12px 14px}}

const D=[
{t:"المحاضرة 3: عملية التحقيق (Investigatory Process)",q:[
["Who is the first responder and what is his job?","من هو المستجيب الأول وما مهمته؟","الشخص الذي ترسله جهة التحقيق لإجراء التحقيق الأولي وتحديد السبب الجذري؛ ويجب أن يفهم كيفية جمع الدليل بطريقة سليمة جنائيًا."],
["Explain consent to search and when it applies.","اشرح الموافقة على التفتيش ومتى تُطبّق.","يسمح المالك بالتفتيش والجمع دون أمر؛ غالبًا عندما لا يكون المالك المشتبه أو عندما وقّع الموظف نموذج تفتيش كشرط للتوظيف."],
["What is a subpoena and what is its drawback?","ما هو أمر الإحضار (Subpoena) وما عيبه؟","أمر محكمة يُطلب عندما لا يسمح المالك بالتفتيش؛ عيبه أن المشتبه قد يملك وقتًا لإتلاف الأدلة."],
["Why do banks demand a court order?","لماذا تطلب البنوك أمرًا قضائيًا؟","لأن سياساتهم الداخلية وأنظمتهم تمنع تسليم المعلومات دونه — وليس رفضًا للتعاون."],
["When is a search warrant used and who can request it?","متى يُستخدم أمر التفتيش ومن يستطيع طلبه؟","عندما قد يؤدي إخبار المشتبه إلى إتلاف الأدلة؛ يُنفذ دون إشعار؛ ومتاح لجهات إنفاذ القانون فقط."],
["What do courts require to issue a search warrant?","ماذا تشترط المحاكم لإصدار أمر التفتيش؟","مؤشرات معقولة تربط شخصًا وأجهزة محددة بنشاط إجرامي."],
["Name the two types of search warrants.","اذكر نوعي أوامر التفتيش.","أمر أجهزة التخزين الإلكترونية؛ وأمر مزود الخدمة (ISP، السحابة، التجار الإلكترونيون)."],
["List five items in a first responder's bag.","اذكر خمسة عناصر في حقيبة المستجيب الأول.","شريط المسرح، ملصقات، قفازات، كاميرا، نماذج سلسلة الحيازة، أكياس مضادة للساكنة، مواد عازلة للراديو، أدوات التقاط RAM/الهارد، لابتوب جنائي."],
["Why is RF-shielding material needed?","لماذا نحتاج مواد عازلة لموجات الراديو؟","لمنع الجوالات/التابلت المضبوطة بشرائح SIM من استقبال المكالمات والرسائل."],
["What to do if you suspect the computer is wiping evidence?","ماذا تفعل إذا اشتبهت أن الجهاز يمسح الأدلة؟","أطفئه فورًا: اسحب الكابل، وانزع البطارية إن أمكن، أو اضغط مطولًا على زر التشغيل إذا كانت ثابتة."],
["What should be done if the computer is OFF? Why photograph the screen?","ماذا تفعل إذا كان الجهاز مطفأ؟ ولماذا نصوّر الشاشة؟","لا تشغّله. وتصوير الشاشة لتوثيق البرامج العاملة والملفات المفتوحة والتاريخ/الوقت."],
["What network information should be acquired before shutdown?","ما معلومات الشبكة التي تُجمع قبل الإطفاء؟","عنوان IP، الجلسات، المنافذ المفتوحة، جدول التوجيه، عناوين LAN، عنوان البث، رقم بطاقة الشبكة."],
["Compare hard and graceful shutdown.","قارن بين الإطفاء القسري والاعتيادي.","القسري: يحفظ الملفات والطوابع ويمنع برامج المسح لكنه يفقد البيانات غير المحفوظة وقد يفسد الملفات. الاعتيادي: يكشف الملفات المفتوحة ويمنع التلف ويسمح بكتابة الآثار لكنه قد يشغل برامج/سكربتات تدميرية ويكتب فوق البيانات."],
["What is the order of volatility?","ما هو ترتيب التطاير؟","تسلسل جمع الأدلة من الأكثر إلى الأقل تطايرًا: المعالج/الكاش ← جداول التوجيه وARP والعمليات ← RAM ← الملفات المؤقتة ← pagefile ← الهارد ← السجلات البعيدة ← التهيئة والطوبولوجيا ← النسخ الاحتياطية والمطبوعات."],
["What is the pagefile?","ما هو ملف pagefile؟","مساحة التبديل/الذاكرة الافتراضية في ويندوز: ملف على الهارد يوسّع الـ RAM المتاح."],
["Why document the crime scene?","لماذا نوثّق مسرح الجريمة؟","لتجنب ترك الأدلة، وللمساعدة في إعداد التقرير، ولتذكر المشهد عند الشهادة."],
["When should the scene be photographed?","متى يجب تصوير المسرح؟","مرتين: عند الدخول وقبل المغادرة بعد ضبط الأجهزة."],
["How should a device be packaged for transport?","كيف يُغلَّف الجهاز للنقل؟","شريط على زر التشغيل، كيس مضاد للساكنة، تسجيل اسمك والتاريخ/الوقت، وإضافة ملاحظات."]
]},
{t:"المحاضرة 4: جمع الأدلة وحفظها + مكافحة التحليل الجنائي",q:[
["What are the common forensic image formats?","ما هي صيغ الصور الجنائية الشائعة؟","Raw، وAFF، وExpert Witness (EnCase)، وصيغ أخرى أقل شيوعًا."],
["Give advantages and disadvantages of the Raw format.","اذكر مزايا وعيوب صيغة Raw.","المزايا: يتجاهل أخطاء القراءة البسيطة وسريع. العيوب: لا ميتاداتا داخلية؛ بنفس حجم المصدر (بلا ضغط)."],
["List features of AFF.","اذكر ميزات صيغة AFF.","مفتوح المصدر، قابل للتوسع، ضغط zlib/LZMA، قابل للتقسيم، يدعم التشفير وكلمة المرور."],
["What is the EnCase image format and its extension?","ما هي صيغة EnCase وما امتدادها؟","ينشئه EnCase؛ قابل للضغط والبحث والتقسيم؛ ميتاداتا أقل من AFF؛ الامتداد E01. وE02…"],
["Why and how are acquired images validated?","لماذا وكيف يتم التحقق من الصور المجمّعة؟","لإثبات أن الصورة مطابقة 100% للأصل ولم تتغير؛ عبر الهاش (MD5, SHA-256) وهو بصمة إلكترونية."],
["When is hashing used in an investigation?","متى يُستخدم الهاش في التحقيق؟","مرتين: قبل التحليل (للتحقق من الصورة/قبل النسخ) وفي النهاية للتحقق من سلامة البيانات والمعالجة."],
["Why is RAM acquisition harder than hard-drive acquisition?","لماذا جمع الـ RAM أصعب من جمع الهارد؟","لأن البيانات تضيع عند الإطفاء وتُستبدل أثناء الاستخدام وغير منظمة؛ وتحتاج أدوات مختلفة."],
["What is dumping?","ما هو الـ Dumping؟","عملية التقاط البيانات من الذاكرة المتطايرة."],
["Name types of information found in RAM.","اذكر أنواع المعلومات الموجودة في الـ RAM.","مفاتيح التشفير، العمليات، أوامر الكونسول، الحافظة، معلومات الشبكة، محتوى مفكوك، كلمات المرور، الرسائل، سجلات التصفح، البرمجيات الخبيثة…"],
["How to handle a locked Windows machine when acquiring RAM?","كيف تتعامل مع ويندوز مقفل عند جمع الـ RAM؟","إطفاء قسري أو تجاوز الدخول دون إعادة تشغيل: أجهزة CaptureGUARD/Phantom Probe، أو هجوم DMA لاستخراج كلمة المرور من الـ RAM."],
["What is the footprint of RAM capture tools and how do courts view it?","ما أثر أدوات التقاط الـ RAM وكيف تراه المحاكم؟","تغييرات ريجستري، وكتابة فوق مدخلات الذاكرة، وقد تكتب القليل على القرص؛ والمحاكم متسامحة غالبًا إذا وُثّق."],
["What factors affect the choice of hard-drive acquisition method?","ما العوامل المؤثرة في اختيار طريقة جمع الهارد؟","حجم القرص، الوقت المتاح، إمكانية نقل الوسيط للمختبر أو الجمع بالموقع، وإمكانية إطفاء الجهاز."],
["Compare physical, logical, and sparse acquisition.","قارن بين الجمع الفيزيائي والمنطقي والمتناثر.","الفيزيائي: نسخة كاملة بت-ببت تشمل المحذوف والمساحة غير المخصصة. المنطقي: بيانات نشطة مختارة فقط. المتناثر: ملفات مختارة مع المحذوف والأجزاء."],
["Compare disk-to-image and disk-to-disk acquisition.","قارن بين الجمع من القرص إلى ملف ومن القرص إلى قرص.","من القرص إلى ملف: الأكثر استخدامًا ويسمح بنسخ كثيرة. من القرص إلى قرص: نسخ إلى قرص بنفس السعة أو أكبر، قليل الاستخدام (مثل الأقراص القديمة)."],
["How do you deal with an encrypted hard drive?","كيف تتعامل مع قرص مشفر؟","جمع الذاكرة المتطايرة (المفاتيح)، جمع القرص ثم فك التشفير بالأدوات، وطلب كلمة المرور من المالك."],
["What are the challenges of cloud and network acquisition?","ما تحديات الجمع من السحابة والشبكة؟","السحابة: قانونية (اختصاصات) وتقنية ولوجستية. الشبكة: حجم بيانات كبير، مهارات تقنية، لا يمكن إيقاف خدمات حرجة، أنظمة الخصوصية."],
["What are HPA and DCO and why do they matter?","ما هما HPA وDCO ولماذا هما مهمان؟","منطقة محمية للمضيف وطبقة إعدادات الجهاز — مناطق مخفية بالقرص قد تحوي أدلة وبعض الأدوات لا تنسخها."],
["Define antiforensics and its aim.","عرّف مكافحة التحليل الجنائي (Antiforensics) وهدفها.","تقنيات لمحاربة التحليل الجنائي وإيقاف وتضليل التحقيقات؛ هدفها إتلاف أو إخفاء الأدلة وإطالة وقت التحليل."],
["Who uses antiforensics?","من يستخدم مكافحة التحليل الجنائي؟","المجرمون والإرهابيون، ولأغراض حسنة: العسكريون والسياسيون والدبلوماسيون والشركات وإنفاذ القانون والباحثون الأمنيون."],
["List the main classes of antiforensics techniques.","اذكر التصنيفات الرئيسية لتقنيات مكافحة التحليل الجنائي.","إخفاء البيانات، إتلاف البيانات، التشفير، إخفاء الهوية التشفيري، الهجوم المباشر على أدوات التحليل."],
["Define steganography and explain how it works.","عرّف الستيغانوغرافي واشرح طريقة عمله.","إخفاء رسالة سرية في ملف عادي: حامل + رسالة ← خوارزمية ← ملف مخفي؛ ويستخرجها المستلم بخوارزمية؛ والمظهر لا يتغير."],
["Name and explain the three steganography embedding techniques.","اذكر واشرح تقنيات التضمين الثلاث في الستيغانوغرافي.","الحقن (بعد EOF)، الاستبدال (بتات غير مهمة؛ الحجم ثابت؛ أكثر أمانًا)، التوليد (ملف جديد؛ الأكثر أمانًا)."],
["Mention types of steganography by carrier file.","اذكر أنواع الستيغانوغرافي حسب الملف الحامل.","نص، صورة (الأكثر استخدامًا)، صوت/فيديو (MP3Stego)، وشبكة (TCP/IP)."],
["What is a limitation of image steganography?","ما قيد الإخفاء في الصور؟","تغيير الحجم أو الصيغة أو التعديل أو القص يتلف الرسالة المخفية."],
["What is watermarking?","ما هي العلامة المائية (Watermarking)؟","نوع من الإخفاء: بيانات سرية مضمنة في صورة/صوت لا يستخرجها إلا المالك بمفتاح سري."],
["Explain the three data destruction methods.","اشرح طرق إتلاف البيانات الثلاث.","مادي (تدمير الوسائط)، إزالة المغنطة (للمغناطيسية فقط لا SSD/USB)، منطقي (أداة مسح؛ الأكثر شيوعًا؛ لا يضمن 100%)."],
["Which timestamps can a suspect change on NTFS?","ما الطوابع الزمنية التي يستطيع المشتبه تغييرها في NTFS؟","إنشاء الملف، الوصول، التعديل، وآخر كتابة في MFT."],
["What are FDE, BitLocker, and EFS?","ما هي FDE وBitLocker وEFS؟","FDE: يشفّر كل بت على القرص. BitLocker: تشفير أقراص ويندوز (منذ Vista) بـ AES. EFS: تشفير NTFS لكل ملف/مجلد."],
["When is password cracking used?","متى يُستخدم كسر كلمات المرور؟","عند عدم وجود طريقة للحصول على مفتاح فك التشفير؛ هو الأمل الأخير لاستخراج بيانات مفيدة."],
["What is cryptographic anonymity? Give an example.","ما هو إخفاء الهوية التشفيري؟ أعطِ مثالًا.","إخفاء الأثر بين المرسل والمستقبل على الشبكات المفتوحة؛ مثل TOR حيث التتبع شبه مستحيل."]
]},
{t:"المحاضرة 5: تحليل الأدلة (Analysis of Evidence)",q:[
["What is the difference between decimal, binary, and hex?","ما الفرق بين العشري والثنائي والسداسي عشر (Hex)؟","العشري: أساس 10 (0–9). الثنائي: أساس 2 (0/1). Hex: أساس 16 (0–9 وA–F) وهو طريقة مختصرة للتعبير عن الثنائي."],
["Define bit and byte.","عرّف البت والبايت.","البت: 1 أو 0. البايت: 8 بتات ويمثل حرفًا واحدًا."],
["What are MSB and LSB?","ما هما MSB وLSB؟","MSB: أقصى اليسار الأعلى قيمة. LSB: أقصى اليمين الأقل قيمة."],
["Convert 110011010 to decimal.","حوّل 110011010 إلى عشري.","256 + 128 + 16 + 8 + 2 = 410."],
["Convert 19A (hex) to decimal.","حوّل 19A (هيكس) إلى عشري.","(1×256) + (9×16) + (10×1) = 256 + 144 + 10 = 410."],
["What does 20 mean in hex text? What are 4D and 61?","ماذا يعني 20 في نص الهيكس؟ وماذا يمثل 4D و61؟","20 = مسافة؛ 4D = الحرف الكبير M؛ 61 = الحرف الصغير a."],
["Compare ASCII and Unicode.","قارن بين ASCII وUnicode.","ASCII: 128 حرفًا (7 بتات) للإنجليزية؛ والممتد 256. Unicode: كل لغات العالم وآلاف الأحرف (UTF-8/16/32 وUCS-2)."],
["What is file carving and when is it used?","ما هو File Carving ومتى يُستخدم؟","تحديد واستخراج الملفات من بيانات خام/مساحة غير مخصصة دون البرنامج الأصلي؛ لاسترجاع الملفات المحذوفة وأجزائها من أقراص ممسوحة أو تالفة."],
["Explain the steps of file carving.","اشرح خطوات File Carving.","إيجاد الترويسة (Header) لتحديد الملف؛ ثم إيجاد التذييل (Footer)؛ وإن كان متصلًا يُنسخ ويُلصق. والملفات المجزأة أصعب."],
["Why is the file extension unreliable for identifying a file?","لماذا لا يُعتمد على امتداد الملف لتحديد نوعه؟","لأنه يسهل تغييره (مثل DOCX إلى JPEG) لإخفاء البيانات أمام الأعين."],
["What is file signature analysis?","ما هو تحليل توقيع الملف؟","مقارنة ترويسة الملف بامتداده لاكتشاف عدم التطابق؛ والأدوات الجنائية تحدد الملف بالترويسة لا بالامتداد."],
["What is metadata? Give examples for Word files and images.","ما هي الميتاداتا؟ أعطِ أمثلة لملفات Word والصور.","بيانات تصف بيانات أخرى. Word: المؤلف، المؤسسة، اسم الجهاز، وقت الإنشاء، التعليقات. الصور: وقت الالتقاط، إحداثيات GPS، تفاصيل الكاميرا، طراز الجهاز."],
["How is metadata useful forensically?","كيف تفيد الميتاداتا جنائيًا؟","تتبع المؤلفين، والبحث في الميتاداتا عن معلومات مهمة، وتحديد الجهاز والمكان والوقت."],
["How can metadata be viewed/edited in Windows?","كيف تُعرض/تُعدّل الميتاداتا في ويندوز؟","كليك يمين ← Properties (أو Alt + Enter)؛ وأدوات: Exif Pilot, GIMP, PDF Metadata Editor, Mp3tag."],
["Differentiate volatile and nonvolatile memory with examples.","فرّق بين الذاكرة المتطايرة وغير المتطايرة مع أمثلة.","المتطايرة: تحتاج طاقة وتفقد البيانات عند الإطفاء (RAM). غير المتطايرة: تحتفظ بالبيانات بدون طاقة (هارد، فلاش، ROM)."],
